[package]
name = "pycleora"
version = "4.0.0"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"
readme = "README.md"
documentation = "https://cleora.ai/docs"
homepage = "https://cleora.ai"
repository = "https://github.com/BaseModelAI/cleora"
description = """
Sparse hypergraph structure and markov-propagation for node embeddings exposed via Python bindings.
"""

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
rustc-hash = "2"
smallvec = "1.13"
# Kept on 1.x on purpose: entity hashes (XXH64, seed 0) feed the deterministic initialisation.
twox-hash = "1.6.3"
ndarray = "0.17"
dashmap = "6"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"

# abi3: one wheel per platform works on every CPython >= 3.10.
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"

[dev-dependencies]
criterion = "0.5"
insta = "1"
# rand 0.8 is pinned so that the snapshot tests keep drawing the exact random
# streams the stored snapshots were generated from.
rand = "0.8"

[[bench]]
name = "cleora_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

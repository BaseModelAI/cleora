# Started from the workflow generated by `maturin generate-ci github` and
# maintained by hand since: it adds a test job and a smoke test of the wheels.
#
# pycleora is built against the stable ABI (abi3, Python >= 3.10), so every
# platform needs exactly one wheel.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: |
          # the test binaries link against libpython
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):${LD_LIBRARY_PATH}"
          cargo test
      - name: Build the extension
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.9.4,<2.0"
          maturin develop --release --extras test
      - name: Python tests
        run: |
          source .venv/bin/activate
          pytest

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          # - runner: ubuntu-latest
          #   target: armv7
          # - runner: ubuntu-latest
          #   target: s390x
          # - runner: ubuntu-latest
          #   target: ppc64le
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc musl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: 'true'
          manylinux: auto
      - name: Smoke test
        if: ${{ matrix.platform.target == 'x86_64' }}
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --no-deps --find-links dist pycleora
          python tests/wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  # musllinux:
